# GENERATED BY ./ci.ts -- DO NOT DIRECTLY EDIT

name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '*'
concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - name: 'Install WASI SDK, Binaryen and WABT'
        run: |-
          curl -sSfL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" >> "$GITHUB_ENV"
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "BINARYEN=$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_ENV"
          curl -sSfL https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-linux-x64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "WABT=$RUNNER_TEMP/wabt-1.0.42" >> "$GITHUB_ENV"
      - name: Lint workflow generation
        if: '!startsWith(github.ref, ''refs/tags/'')'
        run: |-
          ./.github/workflows/ci.ts --lint
          ./.github/workflows/release.ts --lint
      - name: Install prettier's and the prettier plugins' dependencies
        run: deno task setup
      - name: Build
        run: deno task build
      - name: Test
        run: deno task test
      - name: Test prettier's tests
        run: 'deno task test:prettier'
      - name: Test the prettier plugins' tests
        run: 'deno task test:plugins'
      - name: Setup and test npm deployment
        run: |-
          cd deployment/npm
          npm install
          node setup.js
          npm run test
      - name: Get tag version
        id: get_tag_version
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: 'echo TAG_VERSION=${GITHUB_REF/refs\/tags\//} >> $GITHUB_OUTPUT'
      - name: Pre-release
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: |-
          # update config schema to have version
          sed -i 's/dprint-plugin-prettier\/0.0.0/dprint-plugin-prettier\/${{ steps.get_tag_version.outputs.TAG_VERSION }}/' deployment/schema.json
          # update the npm package to have version
          (cd deployment/npm && node setup.js sync-version)
          # create release notes
          deno run -A ./scripts/generate_release_notes.ts 3.9.10 > ${{ github.workspace }}-CHANGELOG.txt
      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: 'startsWith(github.ref, ''refs/tags/'')'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        with:
          files: |-
            deployment/npm/plugin.wasm
            deployment/schema.json
          body_path: '${{ github.workspace }}-CHANGELOG.txt'
          draft: false
      - name: Upgrade npm
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: npm install --global npm@latest
      - name: Publish npm package
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: |-
          cd deployment/npm
          npm publish --access public --provenance
