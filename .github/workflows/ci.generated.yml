# GENERATED BY ./ci.ts -- DO NOT DIRECTLY EDIT

name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '*'
concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 11.0.x
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - name: 'Install WASI SDK, Binaryen and WABT'
        run: |-
          curl -sSfL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" >> "$GITHUB_ENV"
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "BINARYEN=$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_ENV"
          curl -sSfL https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-linux-x64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "WABT=$RUNNER_TEMP/wabt-1.0.42" >> "$GITHUB_ENV"
      - name: Lint workflow generation
        if: '!startsWith(github.ref, ''refs/tags/'')'
        run: |-
          ./.github/workflows/ci.ts --lint
          ./.github/workflows/release.ts --lint
      - name: Install prettier's and the prettier plugins' dependencies
        run: deno task setup
      - name: Build
        run: deno task build
      - name: Generate config schema
        run: 'deno run -A --minimum-dependency-age=0 jsr:@dprint/automation@0.14.4/tasks/publish-schema target/plugin.wasm deployment/schema.json --extension ts'
      - name: Test
        run: deno task test
      - name: Test prettier's tests
        run: 'deno task test:prettier'
      - name: Test the prettier plugins' tests
        run: 'deno task test:plugins'
      - name: Setup and test npm deployment
        run: |-
          cd deployment/npm
          npm install
          node setup.js
          npm run test
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: 'startsWith(github.ref, ''refs/tags/'')'
        with:
          name: release-artifacts
          path: |-
            target/plugin.wasm
            deployment/schema.json
          if-no-files-found: error
  github_release:
    name: github_release
    needs:
      - build
    if: 'startsWith(github.ref, ''refs/tags/'')'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-artifacts
          path: .
      - name: Pre-release
        run: |-
          # update config schema to have version
          sed -i "s/dprint-plugin-prettier\/0.0.0/dprint-plugin-prettier\/$GITHUB_REF_NAME/" deployment/schema.json
          # create release notes
          deno run -A ./scripts/generate_release_notes.ts 3.10.1 > ${{ github.workspace }}-CHANGELOG.txt
      - name: Release
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |-
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file ${{ github.workspace }}-CHANGELOG.txt \
            target/plugin.wasm \
            deployment/schema.json
  npm_publish:
    name: npm_publish
    needs:
      - build
    if: 'startsWith(github.ref, ''refs/tags/'')'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-artifacts
          path: .
      - name: Setup npm package
        run: cd deployment/npm && node setup.js sync-version
      - name: Upgrade npm
        run: npm install --global npm@latest
      - name: Publish npm package
        run: |-
          cd deployment/npm
          npm publish --access public --provenance
