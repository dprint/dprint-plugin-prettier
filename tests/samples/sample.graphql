query Q($id:ID!,$first:Int=10,$filter:Filter={status:OPEN,tags:["a","b"]})@cached{user(id:$id){...UserFields friends(first:$first,after:null)@include(if:$withFriends){edges{node{id name}}}}}
fragment UserFields on User{id,name,email}
"""
